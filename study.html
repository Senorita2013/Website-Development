<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Study Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

  <!-- Header -->
  <div class="bg-primary text-white p-4 rounded mb-3 text-center">
    <h3>📚 Study Dashboard</h3>
    <p class="mb-0">Track your progress</p>
  </div>

  <!-- Buttons -->
  <div class="mb-3 text-center">
    <button class="btn btn-primary btn-sm">Math</button>
    <button class="btn btn-success btn-sm">Science</button>
    <button class="btn btn-warning btn-sm">History</button>
  </div>

  <!-- Subjects -->
  <div class="card mb-2 p-3">
    Math <span class="badge bg-primary float-end">12</span>
    <div class="progress mt-2"><div class="progress-bar" style="width:70%">70%</div></div>
  </div>

  <div class="card mb-2 p-3">
    Science <span class="badge bg-success float-end">18</span>
    <div class="progress mt-2"><div class="progress-bar bg-success" style="width:45%">45%</div></div>
  </div>

  <div class="card p-3">
    History <span class="badge bg-warning text-dark float-end">10</span>
    <div class="progress mt-2"><div class="progress-bar bg-warning text-dark" style="width:60%">60%</div></div>
  </div>

</div>

</body>
</html>
