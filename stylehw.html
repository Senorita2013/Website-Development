<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: Arial; padding: 20px; }
  p { margin: 8px 0; }

  .c { color: red; }
  .f { font-family: Courier; }
  .s { font-size: 22px; }
  .u { text-decoration: underline; }
  .up { text-transform: uppercase; }
</style>
</head>

<body>
  <p class="c">Color</p>
  <p class="f">Font</p>
  <p class="s">Size</p>
  <p class="u">Underline</p>
  <p class="up">transform</p>
</body>
</html>
