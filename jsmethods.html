<!DOCTYPE html>
<html>
<head>
  <title>JavaScript Numbers</title>
</head>
<body>

  <h2>JavaScript Built-in Methods</h2>
  <p id="output"></p>

  <script>
    let numbers = [];

    for (let i = 0; i < 5; i++) {
      numbers.push(Math.floor(Math.random() * 100));
    }

    let date = new Date();

    let randomNumber = Math.random() * 100;
    let roundedNumber = Math.round(randomNumber);

    document.getElementById("output").innerHTML =
      "Random Numbers: " + numbers.join(", ") + "<br><br>" +
      "Current Date: " + date + "<br><br>" +
      "Random Number: " + randomNumber + "<br>" +
      "Rounded Number: " + roundedNumber;
  </script>

</body>
</html>
