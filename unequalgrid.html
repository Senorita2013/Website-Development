<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Unequal Grid</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <style>
    .box{
      color:#fff;
      padding:40px;
      border-radius:12px;
      text-align:center;
      font-weight:bold;
    }
    .a{background:#0d6efd;height:250px;}
    .b{background:#198754;height:120px;}
    .c{background:#dc3545;height:120px;}
    .d{background:#ffc107;color:#000;height:180px;}
  </style>
</head>
<body class="bg-light p-4">

<div class="container">
  <div class="row g-3">
    
    <div class="col-md-8">
      <div class="box a">Large Box</div>
    </div>

    <div class="col-md-4">
      <div class="row g-3">
        <div class="col-12">
          <div class="box b">Top Small</div>
        </div>
        <div class="col-12">
          <div class="box c">Bottom Small</div>
        </div>
      </div>
    </div>

    <div class="col-12">
      <div class="box d">Bottom Wide Box</div>
    </div>

  </div>
</div>

</body>
</html>
