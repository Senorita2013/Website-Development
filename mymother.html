<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favourite Person - My Mother</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #ffe4ec, #e3f2fd);
            min-height: 100vh;
        }

        .profile-card {
            max-width: 650px;
            margin: 60px auto;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .profile-header {
            background: linear-gradient(135deg, #ff6b81, #6c5ce7);
            color: white;
            padding: 40px 20px;
        }

        .info-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .info-item:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card profile-card">

            <div class="profile-header text-center">
                <h1 id="personName"></h1>
                <p class="lead mb-0">My Favourite Person</p>
            </div>

            <div class="card-body p-4">

                <h3 class="text-center mb-4">About My Mother</h3>

                <div class="info-item">
                    <strong>Name:</strong>
                    <span id="fullName"></span>
                </div>

                <div class="info-item">
                    <strong>Age:</strong>
                    <span id="age"></span>
                </div>

                <div class="info-item">
                    <strong>Favourite Colour:</strong>
                    <span id="colour"></span>
                </div>

                <div class="info-item">
                    <strong>Hobby:</strong>
                    <span id="hobby"></span>
                </div>

                <div class="info-item">
                    <strong>Favourite Food:</strong>
                    <span id="food"></span>
                </div>

            </div>
        </div>
    </div>

    <script>
        const favouritePerson = {
            name: "Sarita",
            age: 45,
            favouriteColour: "Pink",
            hobby: "Cooking",
            favouriteFood: "Rice and Dal"
        };

        document.getElementById("personName").textContent = favouritePerson.name;
        document.getElementById("fullName").textContent = favouritePerson["name"];
        document.getElementById("age").textContent = favouritePerson.age;
        document.getElementById("colour").textContent = favouritePerson["favouriteColour"];
        document.getElementById("hobby").textContent = favouritePerson.hobby;
        document.getElementById("food").textContent = favouritePerson["favouriteFood"];
    </script>

</body>
</html>
