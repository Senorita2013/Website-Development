<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jungle Explorer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
section { height: 300px; padding: 60px 20px; }
</style>
</head>

<body data-bs-spy="scroll" data-bs-target="#navbar" data-bs-offset="50" tabindex="0">

<nav id="navbar" class="navbar navbar-dark bg-success sticky-top">
  <div class="container">
    <a class="navbar-brand" href="#">Jungle Explorer</a>
    <ul class="nav">
      <li class="nav-item"><a class="nav-link" href="#wildlife">Wildlife</a></li>
      <li class="nav-item"><a class="nav-link" href="#plants">Plants</a></li>
      <li class="nav-item"><a class="nav-link" href="#adventure">Adventure</a></li>
    </ul>
  </div>
</nav>

<div id="jungleCarousel" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="https://picsum.photos/900/300?random=1" class="d-block w-100" alt="Jungle">
      <div class="carousel-caption"><h5>Dense Jungle</h5></div>
    </div>
    <div class="carousel-item">
      <img src="https://picsum.photos/900/300?random=2" class="d-block w-100" alt="Wildlife">
      <div class="carousel-caption"><h5>Wild Animals</h5></div>
    </div>
    <div class="carousel-item">
      <img src="https://picsum.photos/900/300?random=3" class="d-block w-100" alt="River">
      <div class="carousel-caption"><h5>Jungle Rivers</h5></div>
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#jungleCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>

  <button class="carousel-control-next" type="button" data-bs-target="#jungleCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>

<section id="wildlife" class="bg-light">
  <h2>Wildlife</h2>
  <p>Explore jungle animals.</p>
</section>

<section id="plants" class="bg-success text-white">
  <h2>Plants</h2>
  <p>Discover tropical plants.</p>
</section>

<section id="adventure" class="bg-warning">
  <h2>Adventure</h2>
  <p>Enjoy jungle expeditions.</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
