<!DOCTYPE html>
<html>
<head>
  <title>CSS Properties & Values</title>

  <style>
    body {
      font-family: Arial;
      background-color: #f0f0f0;
    }

    h1 {
      color: darkblue;
      text-align: center;
    }

    p {
      color: black;
      font-size: 18px;
      line-height: 1.5;
    }

    .box {
      width: 200px;
      height: 100px;
      background-color: lightblue;
      border: 2px solid blue;
      margin: 20px;
      padding: 10px;
    }

    .highlight {
      background-color: yellow;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>CSS Properties & Values</h1>

  <p>This paragraph uses <span class="highlight">color</span>, font-size, and line-height.</p>

  <div class="box">
    This box uses width, height, margin, padding, border, and background-color.
  </div>

</body>
</html>
