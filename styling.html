 <!DOCTYPE html>
 <html>
    <head>
        <style>
            div {
                width: 300px;
                height: 100px;
                background-color: yellow;
                border: 1px solid black;
            }
            #myDiv {
                transform: rotateX(180deg);
            }
        </style>
    </head>
    <body>
        <h1>Welcome to Codingal</h1>
        <p>Ready to learn the rotate method....</p>
        <div>
            Codingal
        </div>
        <div id="myDiv">
            Codingal
        </div>
    </body>
 </html>

 <!-- activity 3 -->
  <!DOCTYPE html>
  <html>
    <head>
        <style>
            h1 {
                text-decoration: overline;
                text-transform: capitalize;
            }
            h2 {
                text-decoration: line-through;
                text-transform: uppercase;
            }
            h3 {
                text-decoration: underline;
                text-transform: lowercase;
            }
            h4 {
                text-decoration: underline overline;
                text-transform: none;
            }
        </style>
    </head>
    <body>
        <h1>codingal</h1>
        <h2>codingal</h2>
        <h3>CODINGAL</h3>
        <h4>CODINGAL</h4>
    </body>
  </html>
