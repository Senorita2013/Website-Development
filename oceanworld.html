<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean World</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-info-subtle">

<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">🌊 Ocean World</a>
  </div>
</nav>

<div class="container py-4">

  <div class="text-center mb-4">
    <div class="spinner-border text-primary"></div>
    <div class="spinner-grow text-success"></div>
    <div class="spinner-border text-info"></div>
  </div>

  <div class="row g-3">
    <div class="col-md-4">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=500" class="card-img-top">
        <div class="card-body">
          <h5>Dolphin</h5>
          <p>Friendly and intelligent marine mammal.</p>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1546026423-cc4642628d2d?w=500" class="card-img-top">
        <div class="card-body">
          <h5>Sea Turtle</h5>
          <p>Gracefully swims across oceans.</p>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1520301255226-bf5f144451c1?w=500" class="card-img-top">
        <div class="card-body">
          <h5>Starfish</h5>
          <p>Colorful creature living on the seabed.</p>
        </div>
      </div>
    </div>
  </div>

  <nav class="mt-4">
    <ul class="pagination justify-content-center">
      <li class="page-item disabled"><a class="page-link">Previous</a></li>
      <li class="page-item active"><a class="page-link">1</a></li>

      <li class="page-item"><a class="page-link">3</a></li>
      <li class="page-item"><a class="page-link">Next</a></li>
    </ul>
  </nav>

</div>

</html>
